<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Third-Party Deriv Trading Interface</title>
    <!-- Tailwind CSS for modern layout -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <!-- Top Navigation Bar -->
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-red-500 text-white p-2 rounded-lg font-bold tracking-wider text-sm">3RD-DERIV</div>
            <h1 class="text-xl font-bold tracking-wide">Trading Portal</h1>
        </div>
        <!-- Connection Status Indicator -->
        <div class="flex items-center space-x-4">
            <div id="connection-status" class="flex items-center space-x-2 text-sm text-gray-400">
                <span class="w-3 h-3 rounded-full bg-red-500 inline-block animate-pulse"></span>
                <span>Disconnected</span>
            </div>
            <div id="account-info" class="hidden text-sm bg-gray-700 px-3 py-1.5 rounded-md border border-gray-600">
                <span id="account-currency" class="font-bold text-green-400 text-xs mr-1"></span>
                <span id="account-balance" class="font-mono font-bold">0.00</span>
            </div>
        </div>
    </nav>

    <!-- Main Workspace Container -->
    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Column: Authentication & Market Selector -->
        <div class="space-y-6">
            <!-- Authentication Card -->
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg">
                <h2 class="text-lg font-semibold mb-4 flex items-center text-gray-300">
                    🔑 API Authentication
                </h2>
                <div class="space-y-3">
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider">Deriv API Token</label>
                    <input type="password" id="api-token" placeholder="Paste your Deriv API Token here..." 
                           class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-sm text-gray-200 focus:outline-none focus:border-red-500 transition">
                    <button id="btn-auth" onclick="authenticateToken()" 
                            class="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-2 rounded-lg text-sm transition">
                        Connect Account
                    </button>
                    <p class="text-xs text-gray-500 leading-relaxed mt-2">
                        Generate tokens inside your Deriv account settings under Account Security > API Token.
                    </p>
                </div>
            </div>

            <!-- Asset Selector & Market feed Card -->
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg">
                <h2 class="text-lg font-semibold mb-4 text-gray-300">📈 Market Selection</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Select Asset</label>
                        <select id="market-select" onchange="switchMarket()" 
                                class="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-red-500">
                            <option value="R_100">Volatility 100 Index</option>
                            <option value="R_50">Volatility 50 Index</option>
                            <option value="R_10">Volatility 10 Index</option>
                            <option value="frxEURUSD">EUR/USD Forex</option>
                        </select>
                    </div>
                    
                    <!-- Live Ticker Window -->
                    <div class="bg-gray-900 p-4 rounded-lg border border-gray-700 text-center">
                        <span class="text-xs text-gray-400 block uppercase font-medium mb-1">Live Feed Price</span>
                        <div id="live-price" class="text-3xl font-mono font-bold text-gray-400">---</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Center Column: Trading Execution Desk -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg min-h-[400px] flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-bold text-gray-200 mb-6 border-b border-gray-700 pb-3">🚀 Execution Desk</h2>
                    
                    <!-- Stake Parameter Input -->
                    <div class="max-w-xs mb-8">
                        <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Trade Stake (USD)</label>
                        <div class="relative rounded-lg shadow-sm">
                            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                                <span class="text-gray-400 text-sm">$</span>
                            </div>
                            <input type="number" id="trade-stake" value="10" min="0.35" step="0.5"
                                   class="w-full bg-gray-900 border border-gray-600 rounded-lg pl-8 pr-3 py-2 text-sm font-mono font-bold text-white focus:outline-none focus:border-red-500">
                        </div>
                    </div>

                    <!-- Trade Execution Buttons -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <button onclick="executeTrade('CALL')" class="group relative bg-green-600 hover:bg-green-500 text-white p-5 rounded-xl font-bold text-lg shadow-md transition transform active:scale-95 flex flex-col items-center justify-center">
                            <span class="text-2xl mb-1">▲</span>
                            <span>RISE / CALL</span>
                            <span class="text-xs font-normal text-green-200 mt-1">Predicts market climbs</span>
                        </button>
                        
                        <button onclick="executeTrade('PUT')" class="group relative bg-red-600 hover:bg-red-500 text-white p-5 rounded-xl font-bold text-lg shadow-md transition transform active:scale-95 flex flex-col items-center justify-center">
                            <span class="text-2xl mb-1">▼</span>
                            <span>FALL / PUT</span>
                            <span class="text-xs font-normal text-red-200 mt-1">Predicts market drops</span>
                        </button>
                    </div>
                </div>

                <!-- API Activity & Logs Log Consol -->
                <div class="mt-8">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">WebSocket Transaction Logs</h3>
                    <div id="app-logs" class="bg-gray-900 border border-gray-700 h-32 rounded-lg p-3 overflow-y-auto text-xs font-mono text-green-400 space-y-1">
                        <div>System ready. Input Token to open sessions.</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript Backend Operations Linking to Deriv API -->
    <script>
        // Use App ID 1089 (Standard official App ID for testing environment apps)
        const appId = 1089; 
        const wsUrl = `wss://://derivws.com{appId}`;
        let ws;
        let activeSymbol = "R_100";
        let currentTickSubscriptionId = null;

        // Initialize WebSocket connection on window load
        function initWebSocket() {
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                updateStatus(true, "Connected to Deriv API");
                logMessage("WebSocket connected successfully.");
                // Start tracking default market asset
                subscribeToTicks(activeSymbol);
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleIncomingMessage(data);
            };

            ws.onclose = function() {
                updateStatus(false, "Disconnected");
                logMessage("WebSocket connection closed. Reconnecting...");
                setTimeout(initWebSocket, 5000); // Auto-reconnect loop
            };

            ws.onerror = function(error) {
                logMessage("API WebSocket Error encountered.");
            };
        }

        // Process all data sent back by Deriv WS API Engine
        function handleIncomingMessage(data) {
            const msgType = data.msg_type;

            if (msgType === "tick") {
                if (data.tick) {
                    const price = data.tick.quote;
                    const priceElement = document.getElementById("live-price");
                    
                    // Simple visual effect checking if price moved up/down
                    const oldPrice = parseFloat(priceElement.innerText);
                    if (!isNaN(oldPrice)) {
                        priceElement.className = price >= oldPrice 
                            ? "text-3xl font-mono font-bold text-green-400" 
                            : "text-3xl font-mono font-bold text-red-400";
                    }
                    priceElement.innerText = price.toFixed(data.tick.pip_size || 2);
                }
            } 
            else if (msgType === "authorize") {
                if (data.error) {
                    logMessage(`Auth Failure: ${data.error.message}`);
